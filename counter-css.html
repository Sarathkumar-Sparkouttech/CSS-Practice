<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        ol {
            counter-reset: list;
            list-style: none;
        }

        li {
            counter-increment: list;
        }

        li::before {
            content: counters(list, ".") " ";
        }

        .class-a,
        .class-b {
            counter-reset: student;
        }

        .class-a h3,
        .class-b h3 {
            counter-increment: student;
        }

        .class-a h3::before,
        .class-b h3::before {
            content: counter(student) ". ";
        }
    </style>
</head>

<body>
    <ol>
        <li>CSE
            <ol>
                <li>Ravi</li>
                <li>Kumar</li>
            </ol>
        </li>

        <li>ECE
            <ol>
                <li>Priya</li>
                <li>Surya</li>
            </ol>
        </li>
    </ol>
    <div class="class-a">
        <h3>Sarath</h3>
        <h3>Jala</h3>
        <h3>Ajay</h3>
        <h3>Divash</h3>
    </div>
    <div class="class-b">
        <h3>Sarath</h3>
        <h3>Jala</h3>
        <h3>Ajay</h3>
        <h3>Divash</h3>
    </div>
</body>

</html>
