<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Object-Fit-CSS</title>
    <style>
        .container1 {
            border: 1px solid rgb(223, 143, 143);
            width: 500px;
            height: 350px;
            text-align: center;
            margin: 10px;
            background-color: rgb(245, 133, 140);

        }

        .container1 img {
            width: 250px;
            height: 350px;
            object-fit: cover;
            object-position: 80% 20%;
        }

        .container2 {
            border: 1px solid red;
            width: 500px;
            height: 300px;
            text-align: center;
            margin: 10px;
            background-color: rgb(255, 174, 212);

        }

        .container2 img {
            width: 250px;
            height: 250px;
            object-fit: contain;
            object-position:left;
        }

        .container3 {
            border: 1px solid red;
            width: 500px;
            height: 300px;
            text-align: center;
            margin: 10px;
            background-color: rgb(116, 226, 183);

        }

        .container3 img {
            width: 250px;
            height: 250px;

            object-fit: cover;
        }

        .container4 {
            border: 1px solid red;
            width: 500px;
            height: 300px;
            text-align: center;
            margin: 10px;
            background-color: aqua;



        }

        .container4 img {
            width: 250px;
            height: 250px;
            object-fit: scale-down;
            object-position:left-top;


        }
    </style>
</head>

<body>

    <div class="container1">
        <img src="./116429048.avif" alt="">
        <p>sarath</p>
    </div>
    <div class="container2">
        <img src="./baby-animals-goat-65f8b2c23aa1f.avif" alt="">
    </div>
    <div class="container3">
        <img src="./Minden_00762355.avif" alt="">
    </div>
    <div class="container4">
        <img src="./premium_photo-1730233719882-890f7043eb9e.avif" alt="">
    </div>

</body>

</html>
