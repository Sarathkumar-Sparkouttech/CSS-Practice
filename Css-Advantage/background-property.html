<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            border: 1px solid;
            max-width: 500px;
            height: 250px;
            padding: 30px;
            margin: 50px;
            background-image: url(/image/floewr.jpg);
            background-repeat: no-repeat;
            background-origin: border-box;
            background-clip: border-box;
            background-size: cover;
            text-align: center;
            color: cadetblue;
            background-image: linear-gradient(to bottom, rgb(95, 64, 64), yellow);
        }

        .box:hover {
            opacity: 0.9;
        }
    </style>

</head>

<body>
    <div class="box">
        <h1>sarath</h1>
        <h3>kumar</h3>
        <h3>web developer</h3>
        <p>Lorem ipsum dolor sit amet.</p>
    </div>
</body>

</html>
