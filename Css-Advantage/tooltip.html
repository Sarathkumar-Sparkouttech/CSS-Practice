<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .tooltip{
            border-bottom: 1px dotted black;
            display: inline-block;
            text-align: center;
            position: relative;
        }
        .tooltiptext{
            content: "";
            position: absolute;
            visibility: hidden;
            background-color: black;
            color: white;
            width: 100px;
        
            
        }
        .tooltip:hover .tooltiptext{
            visibility: visible;
            
        }
    </style>
</head>
<body>
    <div class="tooltip">sarathkumar 
        <span class="tooltiptext">web developer</span></div>
</body>
</html>
