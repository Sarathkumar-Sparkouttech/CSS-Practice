<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            padding: 0px;
            margin: 0px;
        }

        body {
            background-image: linear-gradient(rgb(132, 119, 119), rgb(137, 225, 228));
            height: 100vh;
        }

        .layout {
            background-image: linear-gradient(rgb(149, 224, 149), rgb(245, 134, 134));
            display:grid;
            margin:5px;
            height:100vh;
            grid-template-areas:
            'h h h n n n ' 
            
            's a1 a1 a1 a1 a1' 
            's m m m m m '
            's f f f f f ';
        }

        .layout div {
            display: grid;
            padding: 10px;
            justify-content: center;
            border: 1px solid red;
            align-items: center;

        }

        .header {
            grid-area: h;
        }

        .navbar {
            grid-area: n;
        }

        .secetion {
            grid-area: s;
            
        }
        .a1{
            grid-area: a1;
        }
         
        

        .main{
            grid-area: m;
        }

        .footer{
            grid-area: f;
        }
    </style>
</head>


<body>
    <div class="layout">
        <div class="header">heade</div>
        <div class="navbar">navbar</div>
        <div class="secetion">secetion</div>
        <div class="a1">artical</div>
        <div class="main">main</div>
        
        <div class="footer">footer</div>

    </div>
</body>

</html>
