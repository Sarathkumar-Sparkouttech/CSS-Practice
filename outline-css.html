<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Outline css</title>
    <style>
    p{
        border:solid 2px rgb(0, 225, 255);
        outline-style:dotted;
        outline-color:cadetblue;
        outline-width:10px;
        outline-offset: 10px;
    }
</style>
</head>

<body>
    <h1 style="border: solid red 1px; ">sarathkumar</h1>
    <P>Lorem ipsum, dolor sit amet consectetur adipisicing elit. Velit, sapiente ex. Mollitia nisi veniam vel, et ad
        error voluptatibus deleniti.</P>
</body>

</html>
