<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table-CSS</title>
    <style>
        table,
        th,
        td {
            border-collapse: collapse;
            text-align: center;
            padding: 10px;
            width: 200px;

        }

        th {
            
            background-color: rgb(42, 85, 165);
            font-weight: 800;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            height: 30px;

        }

        th:hover {
            background-color: aqua;

        }

        td {
            color: red;

            font-family: Arial, Helvetica, sans-serif;
        }

        td:hover {

            background-color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        tr:nth-child(even) {
            background-color: aqua;
        }
        tr:nth-child(odd){
            background-color: blanchedalmond;
        }
    </style>

</head>

<body>
    <table>
        <h1>Stadunt Table</h1>
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Depatment</th>
            <th>mark</th>

        </tr>
        <tr>
            <td>sarath</td>
            <td>24</td>
            <td>CSE</td>
            <td>A+</td>

        </tr>
        <tr>
            <td>siva</td>
            <td>28</td>
            <td>MECH</td>
            <td>B</td>
        </tr>
        <tr>
            <td>ajay</td>
            <td>24</td>
            <td>EEE</td>
            <td>C</td>
        </tr>
        <tr>
            <td>ajith</td>
            <td>23</td>
            <td>CIVIL</td>
            <td>O+</td>
        </tr>
    </table>
</body>

</html>
