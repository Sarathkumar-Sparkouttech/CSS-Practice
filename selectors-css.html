<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /*Element selector*/
        h1 {
            color: aqua;
        }

        /* ID selector*/
        #head {
            color: blue;
        }

        /* Class selector*/
        .head {
            color: green;
        }

        /* Groupping selector*/
        p,
        h4 {
            color: yellow;
        }

        /* Universal selector*/
        * {
            background-color: lightskyblue;
        }
    </style>
</head>

<body>
    <h1>Hello World!</h1>
    <h2 id="head">Welcome to my website!</h2>
    <h3 class="head">This is a heading level 3</h3>
    <p>This is a paragraph.</p>
    <h4>This is another paragraph.</h4>
</body>

</html>
