<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List-CSS</title>
    <style>
        .a{
            list-style-type: upper-latin;
            list-style-position: inside;
            background-color: blue;
            padding: 20px;
            margin: 30px;
            max-width: 200px;
        }
        .a li{
            color:red;
            background-color: aqua;
            padding: 10px;
            margin: 10px;
        }
        
        .b{
            list-style-type: upper-roman;
            list-style-position: inside;
            background-color: blueviolet;
            padding: 20px;
            margin:30px;
            max-width: 200px;

        }
        .b li{
             color:rgb(255, 0, 0);
            background-color: aqua;
            padding: 10px;
            margin: 10px;
        }
       
    </style>
</head>
<body>
    <h1>Fruites</h1>
    <ol class="a">
        <li>Apple</li>
        <li>Orange</li>
        <li>Mango</li>
        
    </ol>
    <h1>Names</h1>
    <ul class="b">
        <li>Sarath</li>
        <li>Siva</li>
        <li>Ajith</li>
    </ul>
</body>
</html>
